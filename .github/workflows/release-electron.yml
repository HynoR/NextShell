name: Release Electron App

on:
  push:
    tags:
      - "*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-main-tag:
    name: Verify Tag On Main
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}
      release_version: ${{ steps.check.outputs.release_version }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag commit is on main
        id: check
        shell: bash
        run: |
          tag_name="${GITHUB_REF_NAME}"
          release_version="${tag_name#v}"
          semver_regex='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "${release_version}" =~ ${semver_regex} ]]; then
            echo "::error::Tag '${tag_name}' is invalid. Use SemVer tags like v1.2.3 or 1.2.3."
            exit 1
          fi
          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"
          if [[ "${release_version}" == *-* ]]; then
            echo "is_prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_prerelease=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "Resolved release version: ${release_version}"

          git fetch origin main --no-tags --depth=1
          if git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "on_main=true" >> "${GITHUB_OUTPUT}"
            echo "Tag commit is on origin/main."
          else
            echo "on_main=false" >> "${GITHUB_OUTPUT}"
            echo "Tag commit is not on origin/main. Skipping release."
          fi

  build:
    name: Build (${{ matrix.platform }} ${{ matrix.arch }})
    needs: verify-main-tag
    if: needs.verify-main-tag.outputs.on_main == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      RELEASE_VERSION: ${{ needs.verify-main-tag.outputs.release_version }}
      NEXTSHELL_BUILD_VERSION: ${{ needs.verify-main-tag.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Electron caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('apps/desktop/package.json', 'apps/desktop/build/electron-builder.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-

      - name: Install Linux native build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 pkg-config libsecret-1-dev libgtk-3-0 libnss3 libasound2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The macOS keychain matches "Always Allow" against the app's designated
      # requirement. Signing every release with the SAME certificate keeps that
      # requirement stable, so users authorize keychain access once instead of
      # after every update. See KEYCHAIN_UX_PLAN.md §9.
      - name: Import macOS signing certificate
        id: macos-cert
        if: matrix.platform == 'mac'
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_CERT_NAME: ${{ vars.MACOS_CERT_NAME || 'NextShell Dev' }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERT_P12_BASE64}" ]]; then
            echo "::warning::MACOS_CERT_P12_BASE64 is not set — shipping an UNSIGNED macOS build. Every user will be re-prompted for keychain access. Run apps/desktop/scripts/create-signing-cert.sh and add the repository secrets."
            echo "signed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          keychain_path="${RUNNER_TEMP}/nextshell-signing.keychain-db"
          keychain_password="$(/usr/bin/openssl rand -base64 24)"
          p12_path="${RUNNER_TEMP}/nextshell-signing.p12"
          cert_path="${RUNNER_TEMP}/nextshell-signing.pem"

          printf '%s' "${MACOS_CERT_P12_BASE64}" | base64 --decode > "${p12_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${p12_path}" -k "${keychain_path}" -P "${MACOS_CERT_PASSWORD}" -A \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a GUI confirmation that no runner can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain_path}" >/dev/null
          # Keep the login keychain in the search list so tooling that ignores
          # CSC_KEYCHAIN still finds the identity.
          security list-keychains -d user -s "${keychain_path}" $(security list-keychains -d user | tr -d '"')

          # A self-signed root is "invalid" until trusted, and electron-builder
          # only picks up identities that `security find-identity -v` reports.
          security find-certificate -c "${MACOS_CERT_NAME}" -p "${keychain_path}" > "${cert_path}"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "${cert_path}"

          if ! security find-identity -v -p codesigning "${keychain_path}" | grep -qF "${MACOS_CERT_NAME}"; then
            echo "::error::Certificate imported but not valid for code signing."
            security find-identity -v -p codesigning "${keychain_path}"
            exit 1
          fi

          rm -f "${p12_path}"
          echo "signed=true" >> "${GITHUB_OUTPUT}"
          echo "keychain=${keychain_path}" >> "${GITHUB_OUTPUT}"
          echo "Imported code-signing identity: ${MACOS_CERT_NAME}"

      # electron-builder is invoked directly rather than through `pnpm run dist --
      # …`: pnpm forwards the `--` separator verbatim, and yargs then treats every
      # flag after it as a positional. That silently dropped both `--publish
      # never` (so the build tried to publish and failed on a missing GH_TOKEN)
      # and `-c.extraMetadata.version` (so artifacts were stamped 0.1.0).
      - name: Build ${{ matrix.platform }}
        shell: bash
        working-directory: apps/desktop
        env:
          # Empty on Windows and on unsigned macOS builds, where electron-builder
          # falls back to its own auto-discovery (and finds nothing).
          CSC_NAME: ${{ matrix.platform == 'mac' && steps.macos-cert.outputs.signed == 'true' && (vars.MACOS_CERT_NAME || 'NextShell Dev') || '' }}
          CSC_KEYCHAIN: ${{ steps.macos-cert.outputs.keychain }}
        run: |
          pnpm run build
          pnpm exec electron-builder \
            --config build/electron-builder.yml \
            --${{ matrix.platform }} \
            --${{ matrix.arch }} \
            --publish never \
            -c.extraMetadata.version="${RELEASE_VERSION}"

      - name: Check packaged Linux native modules
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          app_dir="apps/desktop/release/linux-unpacked"
          ELECTRON_RUN_AS_NODE=1 "${app_dir}/nextshell" \
            apps/desktop/scripts/check-linux-package.mjs "${app_dir}/resources/app.asar"

      - name: Verify macOS signature is certificate-pinned
        if: matrix.platform == 'mac' && steps.macos-cert.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find apps/desktop/release -maxdepth 2 -name 'NextShell.app' -print -quit)"
          if [[ -z "${app}" ]]; then
            echo "::error::No NextShell.app found under apps/desktop/release"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${app}"
          requirement="$(codesign -d -r- "${app}" 2>&1 | tail -1)"
          echo "${requirement}"
          # An ad-hoc signature yields a cdhash-based requirement, which changes
          # every build and would re-prompt every user after each update.
          if ! grep -q 'certificate leaf' <<<"${requirement}"; then
            echo "::error::Designated requirement is not certificate-pinned — the keychain prompt will return after every update."
            exit 1
          fi

      - name: Upload source maps
        uses: actions/upload-artifact@v4
        with:
          name: sourcemaps-${{ env.RELEASE_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/dist/**/*.map
            apps/desktop/dist-electron/**/*.map
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows artifact
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: win-artifact
          path: apps/desktop/release/*.exe
          if-no-files-found: error

      - name: Upload macOS artifact
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifact
          path: apps/desktop/release/*.dmg
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-artifact
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - build
      - verify-main-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: win-artifact
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: mac-artifact
          path: artifacts/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-artifact
          path: artifacts/

      - name: Create GitHub Release
        # All platform builds (including the packaged native-module checks) must pass.
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ needs.verify-main-tag.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: artifacts/*
